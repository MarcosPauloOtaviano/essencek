<aside class="account-sidebar">
  <ul class="account-nav">
    <li><a href="{% url 'my_orders' %}" {% if request.resolver_match.url_name == 'my_orders' %}class="active"{% endif %}><i class="fas fa-box"></i> Meus pedidos</a></li>
    <li><a href="{% url 'profile' %}" {% if request.resolver_match.url_name == 'profile' %}class="active"{% endif %}><i class="fas fa-user"></i> Meu perfil</a></li>
    <li>
      <form action="{% url 'logout' %}" method="post" class="logout-form">
        {% csrf_token %}
        <button type="submit" class="logout-button"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </form>
    </li>
  </ul>
</aside>
